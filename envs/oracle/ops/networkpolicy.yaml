# ops: default-deny egress. It reads lakeFS, reads the backups (restore drill) and posts metrics, nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-allowlist
  namespace: ops
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:   # DNS (CoreDNS)
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to:   # cloud metadata endpoint: the VM's instance principal (the reason these jobs live in this namespace)
        - ipBlock: {cidr: 169.254.169.254/32}
      ports: [{port: 80, protocol: TCP}]
    # OCI APIs (Object Storage, Monitoring, auth): only the Oracle Services Network ranges of eu-madrid-1 (tag OSN in
    # https://docs.oracle.com/en-us/iaas/tools/public_ip_ranges.json), port 443. Not the "OCI" ranges: those are other
    # customers' public addresses. scripts/check-oci-cidrs.sh (weekly in CI) fails if Oracle changes this list.
    - to:   # oci-osn-cidrs:begin
        - ipBlock: {cidr: 79.72.20.0/23}
        - ipBlock: {cidr: 130.110.239.0/24}
        - ipBlock: {cidr: 134.70.176.0/22}
        - ipBlock: {cidr: 140.91.78.0/23}
        - ipBlock: {cidr: 140.204.112.128/25}
        - ipBlock: {cidr: 155.248.136.0/22}
        - ipBlock: {cidr: 155.248.140.0/25}
      # oci-osn-cidrs:end
      ports: [{port: 443, protocol: TCP}]
    - to:   # lakeFS API
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: data}}
      ports: [{port: 8000, protocol: TCP}]
---
# ops: nothing connects in (the restore drill's scratch services listen on the pod, for its own containers only)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-ingress
  namespace: ops
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# ops: only the gc-freshness pod may reach the Kubernetes API (the node itself, 10.0.0.43:6443, pinned in
# terraform/oracle/main.tf), to read the lakefs-gc Jobs. Egress policies add up, so this widens nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gc-freshness-to-api
  namespace: ops
spec:
  podSelector: {matchLabels: {app: gc-freshness}}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: {cidr: 10.0.0.43/32}
      ports: [{port: 6443, protocol: TCP}]
---
# ops: job-freshness reads the CronJobs' last success time from the Kubernetes API (same address as gc-freshness)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: job-freshness-to-api
  namespace: ops
spec:
  podSelector: {matchLabels: {app: job-freshness}}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: {cidr: 10.0.0.43/32}
      ports: [{port: 6443, protocol: TCP}]
---
# ops: only the node-health pod may reach Prometheus (it reads the host disk use from node-exporter's metrics).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: node-health-to-prometheus
  namespace: ops
spec:
  podSelector: {matchLabels: {app: node-health}}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
          podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports: [{port: 9090, protocol: TCP}]
