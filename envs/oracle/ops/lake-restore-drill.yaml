# Daily lake restore drill: proves that the backups ALONE rebuild the lake, without touching anything live.
# Every day 04:15 UTC (after pg-backup 02:30 and lake-sync 03:00; daily because an OCI absence alarm can wait 3 days
# at most). One pod, everything on localhost:
#   fetch            newest complete dump set (_COMPLETE) from platform-backups: globals.sql + lakefs.dump
#   postgres         scratch Postgres (sidecar)               <- globals + lakefs.dump restored into it
#   seaweedfs        scratch SeaweedFS (sidecar, bucket lake)  <- every object of platform-lake-backup copied into it
#   lakefs           scratch lakeFS on those two (sidecar), same encryption key and admin key as the real one
#   check            per repository: main's commit, then EVERY object on main read once (streamed, from the scratch
#                    SeaweedFS) and its MD5 compared with the checksum lakeFS recorded at write time; then
#                    lake_drill_success = 1 (passed) or 0 (failed) to OCI Monitoring. Alarms: a 0, or nothing for 2 days
# The live Postgres, SeaweedFS and lakeFS are never contacted (ops egress: DNS, metadata, OCI services, lakeFS API;
# the drill does not use the last one). Run it now: ./scripts/lake-restore-test.sh
apiVersion: batch/v1
kind: CronJob
metadata:
  name: lake-restore-drill
  namespace: ops
spec:
  schedule: "15 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1200
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: {app: lake-restore-drill}
        spec:
          restartPolicy: Never
          priorityClassName: platform-batch     # evicted first under memory pressure; never preempts anything
          automountServiceAccountToken: false   # it never talks to the Kubernetes API
          volumes:                         # size caps: a lake that outgrows them fails the drill, never fills the node
            - {name: work, emptyDir: {sizeLimit: 2Gi}}
            - {name: pg, emptyDir: {sizeLimit: 3Gi}}
            - {name: sw, emptyDir: {sizeLimit: 20Gi}}
          initContainers:
            - name: fetch
              image: ghcr.io/oracle/oci-cli:latest@sha256:2127c2f50ee1353fa78cbf538ab91ffaccc0d02b6d0b4144530cef6ee69709f5
              env: [{name: OCI_CLI_AUTH, value: instance_principal}]
              command: [sh, -ec]
              args:
                - |
                  sleep 10   # kube-router adds a new pod to the egress allow-lists with a few seconds of delay
                  NS=$(oci os ns get --query data --raw-output)
                  LATEST=$(oci os object list -ns $NS -bn platform-backups --all --query 'data[].name' --raw-output | tr -d '[]", ' | grep '/_COMPLETE$' | sort | tail -1 | xargs dirname)
                  echo "dump set: $LATEST"
                  for f in globals.sql lakefs.dump; do oci os object get -ns $NS -bn platform-backups --name "$LATEST/$f" --file /work/$f >/dev/null; done
                  echo "$LATEST" > /work/SET
                  REGION=$(python3 -c 'import json,urllib.request; print(json.load(urllib.request.urlopen(urllib.request.Request("http://169.254.169.254/opc/v2/instance/", headers={"Authorization": "Bearer Oracle"})))["canonicalRegionName"])')
                  printf 'export RCLONE_CONFIG_OCI_NAMESPACE=%s RCLONE_CONFIG_OCI_REGION=%s\n' "$NS" "$REGION" > /work/oci.env
              volumeMounts: [{name: work, mountPath: /work}]
              securityContext: {runAsUser: 1000, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
            - name: postgres                 # sidecar: runs until the pod ends
              image: timescale/timescaledb:latest-pg17@sha256:6a6b7d7a346d7c6be03a310c240706f3bbc6d7adbdf3fbc07823570b34337f5e
              restartPolicy: Always
              env: [{name: POSTGRES_HOST_AUTH_METHOD, value: trust}, {name: PGDATA, value: /pg/data}]
              startupProbe: {exec: {command: [pg_isready, -h, 127.0.0.1, -U, postgres]}, periodSeconds: 2, failureThreshold: 60}
              volumeMounts: [{name: pg, mountPath: /pg}]
              resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 512Mi}}
              securityContext: {runAsUser: 70, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
            - name: seaweedfs                # sidecar; no s3 config = no authentication (the ops policy lets nothing in)
              image: chrislusf/seaweedfs:latest@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
              restartPolicy: Always
              args: [server, -dir=/data, -ip=127.0.0.1, -ip.bind=0.0.0.0, -master.volumeSizeLimitMB=64, -volume.max=20, -s3, -s3.port=8333]
              startupProbe: {tcpSocket: {port: 8333}, periodSeconds: 2, failureThreshold: 60}
              volumeMounts: [{name: sw, mountPath: /data}]
              resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 512Mi}}
              securityContext: {runAsUser: 65534, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
            - name: restore-db
              image: timescale/timescaledb:latest-pg17@sha256:6a6b7d7a346d7c6be03a310c240706f3bbc6d7adbdf3fbc07823570b34337f5e
              command: [sh, -ec]
              args:
                - |
                  # roles first; the postgres role already exists in the scratch server, so its CREATE is skipped
                  sed '/^CREATE ROLE postgres;$/d' /work/globals.sql | psql -q -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres >/dev/null
                  createdb -h 127.0.0.1 -U postgres -O lakefs lakefs
                  pg_restore -h 127.0.0.1 -U postgres -d lakefs --exit-on-error /work/lakefs.dump
                  echo "lakefs database restored: $(psql -h 127.0.0.1 -U postgres -d lakefs -tAc 'select count(*) from kv') kv rows"
              volumeMounts: [{name: work, mountPath: /work}]
              securityContext: {runAsUser: 70, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
            - name: restore-objects
              image: rclone/rclone:1.71.2@sha256:3103526c506266a9ecdf064efe99bf3677d92ef6407af124d8c56b4f49cbaa51
              env:
                - {name: RCLONE_CONFIG_OCI_TYPE, value: oracleobjectstorage}
                - {name: RCLONE_CONFIG_OCI_PROVIDER, value: instance_principal_auth}
                - {name: RCLONE_CONFIG_LAKE_TYPE, value: s3}
                - {name: RCLONE_CONFIG_LAKE_PROVIDER, value: SeaweedFS}
                - {name: RCLONE_CONFIG_LAKE_ENDPOINT, value: "http://127.0.0.1:8333"}
                - {name: HOME, value: /tmp}
              command: [sh, -ec]
              args:
                - |
                  . /work/oci.env
                  rclone mkdir lake:lake
                  rclone copy oci:platform-lake-backup lake:lake --transfers 4 --checkers 8 -q
                  echo "objects restored into the scratch SeaweedFS: $(rclone size lake:lake --json)"
              volumeMounts: [{name: work, mountPath: /work}]
              resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
              securityContext: {runAsUser: 65534, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
            - name: lakefs                   # sidecar, started only after both restores
              image: treeverse/lakefs:1.86.0@sha256:fb7a0d90f77e3f893e8b8c6f3be131c090f6f0160c2d6c7784c4378cf7e66ea1
              restartPolicy: Always
              args: [run]
              env:
                - {name: LAKEFS_DATABASE_TYPE, value: postgres}
                - {name: LAKEFS_DATABASE_POSTGRES_CONNECTION_STRING, value: "postgres://lakefs@127.0.0.1:5432/lakefs?sslmode=disable"}
                - {name: LAKEFS_AUTH_ENCRYPT_SECRET_KEY, valueFrom: {secretKeyRef: {name: lakefs-auth, key: LAKEFS_AUTH_ENCRYPT_SECRET_KEY}}}
                - {name: LAKEFS_BLOCKSTORE_TYPE, value: s3}
                - {name: LAKEFS_BLOCKSTORE_S3_ENDPOINT, value: "http://127.0.0.1:8333"}
                - {name: LAKEFS_BLOCKSTORE_S3_FORCE_PATH_STYLE, value: "true"}
                - {name: LAKEFS_BLOCKSTORE_S3_DISCOVER_BUCKET_REGION, value: "false"}
                - {name: LAKEFS_BLOCKSTORE_S3_REGION, value: us-east-1}
                - {name: LAKEFS_BLOCKSTORE_S3_CREDENTIALS_ACCESS_KEY_ID, value: drill}
                - {name: LAKEFS_BLOCKSTORE_S3_CREDENTIALS_SECRET_ACCESS_KEY, value: drill}
                - {name: LAKEFS_BLOCKSTORE_S3_DISABLE_PRE_SIGNED, value: "true"}
                - {name: LAKEFS_EMAIL_SUBSCRIPTION_ENABLED, value: "false"}
                - {name: LAKEFS_STATS_ENABLED, value: "false"}
              startupProbe: {httpGet: {path: /_health, port: 8000}, periodSeconds: 2, failureThreshold: 90}
              resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 512Mi}}
              securityContext: {runAsUser: 100, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          containers:
            # check + heartbeat in one container (the OCI CLI image has Python): it posts lake_drill_success=1 when every
            # object checks out and 0 when not, so a failed check alarms the same morning (an earlier failure, e.g. a
            # restore step, leaves no value at all: the 2-day absence alarm catches that).
            - name: check
              image: ghcr.io/oracle/oci-cli:latest@sha256:2127c2f50ee1353fa78cbf538ab91ffaccc0d02b6d0b4144530cef6ee69709f5
              env:
                - {name: OCI_CLI_AUTH, value: instance_principal}
                - {name: LAKEFS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: lakefs-auth, key: LAKEFS_ACCESS_KEY_ID}}}
                - {name: LAKEFS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: lakefs-auth, key: LAKEFS_SECRET_ACCESS_KEY}}}
              command: [sh, -ec]
              args:
                - |
                  set +e
                  python3 - <<'PY'
                  # One listing per 1000 objects through the lakeFS API (path, checksum, size), then each object read
                  # once, streamed, straight from the scratch SeaweedFS at its physical address: MD5 compared with the
                  # checksum lakeFS recorded at write time. Nothing is downloaded to disk; time grows with bytes, not
                  # with API calls. Multipart checksums (with "-") are not MD5s: size compared instead.
                  import base64, hashlib, json, os, sys, urllib.parse, urllib.request
                  API = "http://127.0.0.1:8000/api/v1"
                  AUTH = "Basic " + base64.b64encode(f"{os.environ['LAKEFS_ACCESS_KEY_ID']}:{os.environ['LAKEFS_SECRET_ACCESS_KEY']}".encode()).decode()
                  def api(path, **q):
                      url = API + path + ("?" + urllib.parse.urlencode(q) if q else "")
                      return json.load(urllib.request.urlopen(urllib.request.Request(url, headers={"Authorization": AUTH}), timeout=60))
                  print("dump set:", open("/work/SET").read().strip())
                  repos = [r["id"] for r in api("/repositories", amount=1000)["results"]]
                  if not repos:
                      print("FAIL: no repository in the restored lakeFS"); sys.exit(1)
                  failed = False
                  for repo in repos:
                      head = api(f"/repositories/{repo}/refs/main/commits", amount=1)["results"][0]
                      listed = ok = sized = bad = 0; after = ""
                      while True:
                          page = api(f"/repositories/{repo}/refs/main/objects/ls", amount=1000, after=after, presign="false")
                          for o in page["results"]:
                              if o.get("path_type") != "object":
                                  continue
                              listed += 1
                              addr = urllib.parse.urlparse(o["physical_address"])     # s3://<bucket>/<key>
                              url = "http://127.0.0.1:8333/" + addr.netloc + urllib.parse.quote(addr.path)
                              md5, size = hashlib.md5(), 0
                              try:
                                  with urllib.request.urlopen(url, timeout=120) as r:
                                      for chunk in iter(lambda: r.read(1 << 20), b""):
                                          md5.update(chunk); size += len(chunk)
                              except OSError as e:
                                  bad += 1; print("  missing:", o["path"], e); continue
                              if "-" in o["checksum"]:
                                  if size == o["size_bytes"]: sized += 1
                                  else: bad += 1; print("  wrong size:", o["path"])
                              elif md5.hexdigest() == o["checksum"]:
                                  ok += 1
                              else:
                                  bad += 1; print("  wrong checksum:", o["path"])
                          if not page["pagination"]["has_more"]:
                              break
                          after = page["pagination"]["next_offset"]
                      status = "OK" if listed and bad == 0 and ok + sized == listed and ok > 0 else "FAIL"
                      failed |= status == "FAIL"
                      print(f"{repo}: main {head['id']} ({head['creation_date']}), {listed} objects: {ok} MD5 equal, "
                            f"{sized} multipart same size, {bad} wrong or missing: {status}")
                  print("LAKE RESTORE TEST " + ("FAILED" if failed else "OK"))
                  sys.exit(1 if failed else 0)
                  PY
                  rc=$?
                  MD=$(python3 -c 'import json,urllib.request; d=json.load(urllib.request.urlopen(urllib.request.Request("http://169.254.169.254/opc/v2/instance/", headers={"Authorization": "Bearer Oracle"}))); print(d["compartmentId"], d["canonicalRegionName"])')
                  COMP=${MD% *}; REGION=${MD#* }; VALUE=$([ $rc -eq 0 ] && echo 1 || echo 0)
                  oci monitoring metric-data post --endpoint "https://telemetry-ingestion.$REGION.oraclecloud.com" \
                    --metric-data "[{\"namespace\":\"platform_backup\",\"compartmentId\":\"$COMP\",\"name\":\"lake_drill_success\",\"dimensions\":{\"cluster\":\"oracle\"},\"datapoints\":[{\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"value\":$VALUE}]}]" >/dev/null
                  echo "heartbeat posted (lake_drill_success=$VALUE)"
                  exit $rc
              volumeMounts: [{name: work, mountPath: /work}]
              resources: {requests: {cpu: 50m, memory: 96Mi}, limits: {memory: 256Mi}}   # no ephemeral-storage limit: with limits on some containers only, the kubelet compares the WHOLE pod (restored data included) with their sum; the emptyDir sizeLimits are the cap
              securityContext: {runAsUser: 1000, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
