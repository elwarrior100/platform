# The lakeFS keys, delivered into the ops namespace from the vault: the admin key for the silver freshness check, and
# the encryption key the daily restore drill needs to open the admin credentials inside the restored database.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lakefs-auth
  namespace: ops
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: oci-vault}
  target: {name: lakefs-auth, creationPolicy: Orphan, deletionPolicy: Retain}
  data:
    - {secretKey: LAKEFS_ACCESS_KEY_ID, remoteRef: {key: data-lakefs-auth, property: ADMIN_ACCESS_KEY_ID}}
    - {secretKey: LAKEFS_SECRET_ACCESS_KEY, remoteRef: {key: data-lakefs-auth, property: ADMIN_SECRET_ACCESS_KEY}}
    - {secretKey: LAKEFS_AUTH_ENCRYPT_SECRET_KEY, remoteRef: {key: data-lakefs-auth, property: AUTH_ENCRYPT_SECRET_KEY}}
