# Web UIs through the k3s ingress controller (Traefik), so no tunnel is needed.
# Oracle: the Tailscale IP of the VM. sslip.io answers <anything>.100.108.9.15.sslip.io with 100.108.9.15, a private
# tailnet address, so only devices on your tailnet can open these URLs. The OCI firewall keeps port 80 closed to the internet.
# Each Ingress also answers <service>.taila669aa.ts.net: the HTTPS name a Tailscale Service on the VM serves with a valid
# certificate and hands to Traefik on 127.0.0.1:80, keeping the Host header (envs/oracle/tailscale-services.sh; the
# sslip.io names stay as the fallback). HTTP inside: the traffic is already encrypted end to end by Tailscale. SeaweedFS has no login and
# is deliberately not published. scripts/ui.sh (port-forward tunnels) is the fallback;
# SeaweedFS is reached only with kubectl exec + weed shell (docs/runbook.md).
---
# Airflow: https://airflow.taila669aa.ts.net (fallback http://airflow.100.108.9.15.sslip.io)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: airflow
  namespace: airflow
spec:
  ingressClassName: traefik
  rules:
    - host: airflow.100.108.9.15.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: airflow-api-server, port: {number: 8080}}
    - host: airflow.taila669aa.ts.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: airflow-api-server, port: {number: 8080}}
