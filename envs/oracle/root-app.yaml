# Root application (app-of-apps) for the oracle cluster: the shared platform apps (platform/argocd/apps) plus
# this environment's own apps (envs/oracle/apps). Apply once per cluster:
#   kubectl apply -f envs/oracle/root-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/elwarrior100/platform.git
      targetRevision: main
      path: platform/argocd/apps
    - repoURL: https://github.com/elwarrior100/platform.git
      targetRevision: main
      path: envs/oracle/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
