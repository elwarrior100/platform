# Root application (app-of-apps) for the oracle cluster. envs/oracle/apps is a Kustomization: the shared
# applications (platform/argocd/apps) plus this environment's own. Apply once per cluster:
#   kubectl apply -f envs/oracle/root-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/elwarrior100/platform.git
    targetRevision: oracle
    path: envs/oracle/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
