# lakeFS garbage collection (weekly CronJob in data). Oracle only: see envs/oracle/lakefs-gc/gc.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lakefs-gc
  namespace: argocd
  labels:
    platform/git-source: "true"     # reads this repository: each environment sets which branch
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  source:
    repoURL: https://github.com/elwarrior100/platform.git
    targetRevision: main
    path: envs/oracle/lakefs-gc
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
