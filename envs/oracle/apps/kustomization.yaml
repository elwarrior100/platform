# Oracle cluster: the shared applications plus its own (secret store with instance principal, backups).
# It follows the "oracle" branch instead of main: a change is tried on the local cluster first and reaches Oracle
# only when promoted (scripts/promote-oracle.sh fast-forwards the oracle branch to a tested commit).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../platform/argocd/apps
  - secret-store.yaml
  - ingress.yaml
  - backup.yaml
  - ops.yaml
  - lakefs-gc.yaml
patches:
  - target: {kind: Application, labelSelector: "platform/git-source=true"}
    patch: |-
      - {op: replace, path: /spec/source/targetRevision, value: oracle}
  - target: {kind: ApplicationSet, name: projects}
    patch: |-
      - {op: replace, path: /spec/generators/0/git/revision, value: oracle}
      - {op: replace, path: /spec/template/spec/source/targetRevision, value: oracle}
      # PAUSED (2026-11-17, Stephane's decision): the modbus project is stopped on Oracle until he has reviewed all
      # its code. No automated sync, so the collector, writer and OPC UA edge stay scaled to 0 (done by hand, in that
      # order, after the writer drained the spool). To resume: delete this line, set modbus_running = true in
      # terraform/oracle/variables.tf, scale the three deployments back to 1 and unpause the DAGs (docs/PLAN.md).
      - {op: remove, path: /spec/template/spec/syncPolicy/automated}
  - target: {kind: Application, labelSelector: "platform/values-source=true"}
    patch: |-
      - {op: replace, path: /spec/sources/1/targetRevision, value: oracle}
      - {op: replace, path: /spec/sources/2/targetRevision, value: oracle}
  - target: {kind: Application, labelSelector: "platform/values-source-1=true"}
    patch: |-
      - {op: replace, path: /spec/sources/1/targetRevision, value: oracle}
