# backup: default-deny egress. It holds the most sensitive credentials, so it may only reach Postgres, SeaweedFS, the metadata endpoint and OCI.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-allowlist
  namespace: backup
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:   # DNS (CoreDNS)
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to:   # cloud metadata endpoint: the VM's instance principal (the reason these jobs live in this namespace)
        - ipBlock: {cidr: 169.254.169.254/32}
      ports: [{port: 80, protocol: TCP}]
    # OCI APIs (Object Storage, Monitoring, auth): only the Oracle Services Network ranges of eu-madrid-1 (tag OSN in
    # https://docs.oracle.com/en-us/iaas/tools/public_ip_ranges.json), port 443. Not the "OCI" ranges: those are other
    # customers' public addresses. scripts/check-oci-cidrs.sh (weekly in CI) fails if Oracle changes this list.
    - to:   # oci-osn-cidrs:begin
        - ipBlock: {cidr: 79.72.20.0/23}
        - ipBlock: {cidr: 130.110.239.0/24}
        - ipBlock: {cidr: 134.70.176.0/22}
        - ipBlock: {cidr: 140.91.78.0/23}
        - ipBlock: {cidr: 140.204.112.128/25}
        - ipBlock: {cidr: 155.248.136.0/22}
        - ipBlock: {cidr: 155.248.140.0/25}
      # oci-osn-cidrs:end
      ports: [{port: 443, protocol: TCP}]
    - to:   # Postgres (dump) and SeaweedFS S3 (lake copy)
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: data}}
      ports: [{port: 5432, protocol: TCP}, {port: 8333, protocol: TCP}]
