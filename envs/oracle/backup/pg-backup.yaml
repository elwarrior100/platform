# Runs in its own namespace "backup": the only namespace allowed to reach the cloud metadata endpoint (the VM's
# instance principal), with only the Postgres superuser password delivered to it.
#
# Nightly logical backup of every platform database (ingest spool, lakeFS metadata, Airflow, OpenMetadata) plus
# the roles, uploaded to the platform-backups bucket (terraform/oracle/backups.tf). Oracle deletes dumps after
# 14 days; the VM may create and read objects there but not delete them.
#
# 1. init container (postgres image): pg_dumpall --globals-only + pg_dump -Fc of each database into an emptyDir
# 2. main container (OCI CLI): uploads them with the VM's instance principal (no key anywhere)
# Restore: scripts/pg-restore-test.sh restores the latest dump into scratch databases and compares row counts.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
  namespace: backup
spec:
  schedule: "30 2 * * *"            # 02:30 UTC, away from the hourly silver run at :10
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: pg-backup                       # the backup namespace is the only one allowed to reach the
                                                 # metadata endpoint (instance principal): see network-policies
        spec:
          restartPolicy: Never
          volumes:
            - {name: dump, emptyDir: {}}
          initContainers:
            - name: dump
              image: timescale/timescaledb:latest-pg17@sha256:6a6b7d7a346d7c6be03a310c240706f3bbc6d7adbdf3fbc07823570b34337f5e
              env:
                - name: PGPASSWORD
                  valueFrom: {secretKeyRef: {name: postgres-auth, key: POSTGRES_PASSWORD}}
              command:
                - sh
                - -ec
                - |
                  H=postgres.data.svc.cluster.local
                  # a new pod is only added to the network-policy allow-lists a few seconds after it starts (kube-router):
                  # wait for Postgres instead of failing on the first connection
                  for i in $(seq 1 30); do pg_isready -q -h $H -p 5432 && break; sleep 2; done
                  pg_dumpall -h $H -U postgres --globals-only > /dump/globals.sql
                  for db in $(psql -h $H -U postgres -At -c "select datname from pg_database where not datistemplate and datname <> 'postgres'"); do
                    pg_dump -h $H -U postgres -Fc -f /dump/$db.dump $db
                  done
                  ls -l /dump
              volumeMounts: [{name: dump, mountPath: /dump}]
              resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 512Mi}}
          containers:
            - name: upload
              image: ghcr.io/oracle/oci-cli:latest@sha256:2127c2f50ee1353fa78cbf538ab91ffaccc0d02b6d0b4144530cef6ee69709f5
              env:
                - {name: OCI_CLI_AUTH, value: instance_principal}
              command:
                - sh
                - -ec
                - |
                  NS=$(oci os ns get --query data --raw-output)
                  PREFIX=$(date -u +%Y-%m-%d/%H%M%S)      # one prefix per run: a retry never overwrites (the VM may not)
                  oci os object bulk-upload -ns "$NS" -bn platform-backups --src-dir /dump --object-prefix "$PREFIX/"
                  # written LAST: a run without it is incomplete, and the restore test ignores it
                  date -u +%FT%TZ > /tmp/_COMPLETE && oci os object put -ns "$NS" -bn platform-backups --file /tmp/_COMPLETE --name "$PREFIX/_COMPLETE" >/dev/null
                  echo "uploaded to platform-backups/$PREFIX/ (complete)"
                  # heartbeat for the OCI alarm "no successful backup in 26 h" (terraform/oracle/alarms.tf)
                  MD=$(python3 -c 'import json,urllib.request; d=json.load(urllib.request.urlopen(urllib.request.Request("http://169.254.169.254/opc/v2/instance/", headers={"Authorization": "Bearer Oracle"}))); print(d["compartmentId"], d["canonicalRegionName"])')
                  COMP=${MD% *}; REGION=${MD#* }
                  NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  oci monitoring metric-data post --endpoint "https://telemetry-ingestion.$REGION.oraclecloud.com" \
                    --metric-data "[{\"namespace\":\"platform_backup\",\"compartmentId\":\"$COMP\",\"name\":\"backup_success\",\"dimensions\":{\"cluster\":\"oracle\"},\"datapoints\":[{\"timestamp\":\"$NOW\",\"value\":1}]}]" >/dev/null
                  echo "heartbeat posted (backup_success)"
              volumeMounts: [{name: dump, mountPath: /dump}]
              resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 512Mi}}
