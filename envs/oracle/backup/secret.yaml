# Only what the backup jobs need, delivered into the backup namespace from the vault:
#   postgres-auth   (POSTGRES_PASSWORD)       for the nightly pg_dump
#   seaweedfs-s3    (the SeaweedFS S3 key)    for the nightly copy of the lake objects
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-auth
  namespace: backup
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: oci-vault}
  target: {name: postgres-auth, creationPolicy: Orphan, deletionPolicy: Retain}
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef: {key: data-postgres-auth, property: POSTGRES_PASSWORD}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaweedfs-s3
  namespace: backup
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: oci-vault}
  target: {name: seaweedfs-s3, creationPolicy: Orphan, deletionPolicy: Retain}
  data:
    - {secretKey: RCLONE_CONFIG_LAKE_ACCESS_KEY_ID, remoteRef: {key: data-seaweedfs-auth, property: S3_ACCESS_KEY}}
    - {secretKey: RCLONE_CONFIG_LAKE_SECRET_ACCESS_KEY, remoteRef: {key: data-seaweedfs-auth, property: S3_SECRET_KEY}}
