# Nightly copy of the lake objects (SeaweedFS bucket "lake") to Object Storage (platform-lake-backup), so the
# lakeFS metadata in the pg_dump always has its objects somewhere off the VM disk. IN BUNDLES (ADR-016): copied one
# object at a time, a lake of thousands of small files needed ~6k requests a night and broke the free 50k requests a
# month. Now, each night:
#   - list the lake (free: it is in the cluster) and read the newest catalog (catalog/<time>.txt.gz: one line per
#     object already copied, "key<TAB>bundle")
#   - pack only the new objects into bundles/<time>-incr.tar.gz; once a week pack EVERYTHING into
#     bundles/<time>-full.tar.gz (so a restore never needs more than a week of bundles)
#   - write the new catalog (previous lines + the new ones; after a full, only the full's)
# About 6 requests a night. Names are timestamps: nothing is ever overwritten, and the VM may neither overwrite nor
# delete there; Object Storage itself deletes bundles and catalogs after 9 days (terraform/oracle/backups.tf). On success it posts lake_sync_success (OCI alarm when missing). Runs after pg-backup (02:30).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: lake-sync
  namespace: backup
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: {app: lake-sync}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false   # it never talks to the Kubernetes API
          volumes: [{name: cfg, emptyDir: {}}, {name: tmp, emptyDir: {sizeLimit: 512Mi}}, {name: work, emptyDir: {sizeLimit: 12Gi}}]
          initContainers:
            # the Object Storage namespace and the bucket's compartment are looked up with the instance principal,
            # so no account identifier has to live in this public repository
            - name: lookup
              image: ghcr.io/oracle/oci-cli:latest@sha256:2127c2f50ee1353fa78cbf538ab91ffaccc0d02b6d0b4144530cef6ee69709f5
              env: [{name: OCI_CLI_AUTH, value: instance_principal}, {name: HOME, value: /tmp}]
              command: [sh, -ec]
              args:
                - |
                  REGION=$(python3 -c 'import json,urllib.request; print(json.load(urllib.request.urlopen(urllib.request.Request("http://169.254.169.254/opc/v2/instance/", headers={"Authorization": "Bearer Oracle"})))["canonicalRegionName"])')
                  NS=$(oci os ns get --query data --raw-output)
                  COMP=$(oci os bucket get -ns "$NS" --bucket-name platform-lake-backup --query 'data."compartment-id"' --raw-output)
                  printf 'export RCLONE_CONFIG_OCI_NAMESPACE=%s RCLONE_CONFIG_OCI_COMPARTMENT=%s RCLONE_CONFIG_OCI_REGION=%s\n' "$NS" "$COMP" "$REGION" > /cfg/oci.env
              volumeMounts: [{name: cfg, mountPath: /cfg}, {name: tmp, mountPath: /tmp}]
              securityContext: {runAsUser: 1000, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
            - name: bundle
              image: rclone/rclone:1.71.2@sha256:3103526c506266a9ecdf064efe99bf3677d92ef6407af124d8c56b4f49cbaa51
              envFrom: [{secretRef: {name: seaweedfs-s3}}]
              env:
                # source: SeaweedFS S3 gateway (read-only key from the secret above)
                - {name: RCLONE_CONFIG_LAKE_TYPE, value: s3}
                - {name: RCLONE_CONFIG_LAKE_PROVIDER, value: SeaweedFS}
                - {name: RCLONE_CONFIG_LAKE_ENDPOINT, value: "http://seaweedfs.data.svc.cluster.local:8333"}
                # target: OCI Object Storage with the VM's instance principal (no key).
                # ONE request per file, never multipart: a multipart upload needs OBJECT_OVERWRITE, which the VM does
                # not have on purpose (the copy stays tamper-proof). 2026-11-17: a 9,440-object bundle went over the
                # old 256Mi cutoff and failed with "404 BucketNotFound" (OCI's answer to a missing permission). A single
                # PUT takes up to 5 GiB here (the lake must stay well under that anyway, ADR-016), and costs 1 request.
                - {name: RCLONE_CONFIG_OCI_TYPE, value: oracleobjectstorage}
                - {name: RCLONE_CONFIG_OCI_PROVIDER, value: instance_principal_auth}
                - {name: RCLONE_OOS_UPLOAD_CUTOFF, value: 5Gi}
                - {name: RCLONE_MULTI_THREAD_STREAMS, value: "0"}     # no "multi-thread copy" (it is multipart too)
                - {name: HOME, value: /tmp}
              command: [sh, -ec]
              args:
                - |
                  set -o pipefail                       # a failed rclone in a pipe fails the run
                  . /cfg/oci.env
                  B=oci:platform-lake-backup
                  NOW=$(date -u +%Y%m%dT%H%M%S)
                  cd /work
                  rclone lsf -R --files-only lake:lake | sort > lake.txt                      # the lake (in the cluster: free)
                  rclone lsf "$B/catalog/" > catalogs.txt                                   # 1 request; an error fails the run
                  rclone lsf "$B/bundles/" --include '*-full.tar.gz' > fulls.txt            # 1 request
                  LATEST=$(sort catalogs.txt | tail -1)
                  NEWEST_FULL=$(sort fulls.txt | tail -1 | cut -c1-8)                        # YYYYMMDD
                  WEEK_AGO=$(date -u -d "@$(( $(date +%s) - 7 * 86400 ))" +%Y%m%d)
                  # a full every week (when the newest full is 7 days old or more), or the very first time (the
                  # listing worked and is empty). Object Storage deletes bundles and catalogs after 9 days, so a
                  # restore (newest full + the incrementals after it) always finds everything it needs
                  if [ -z "$LATEST" ] || [ -z "$NEWEST_FULL" ] || ! [ "$NEWEST_FULL" \> "$WEEK_AGO" ]; then
                    MODE=full; : > catalog.txt
                  else
                    MODE=incr; rclone cat "$B/catalog/$LATEST" | gunzip > catalog.txt            # 1 request
                  fi
                  cut -f1 catalog.txt | sort > have.txt
                  comm -23 lake.txt have.txt > new.txt
                  N=$(wc -l < new.txt | tr -d ' ')
                  echo "lake: $(wc -l < lake.txt | tr -d ' ') objects; already bundled: $(wc -l < have.txt | tr -d ' '); new: $N ($MODE)"
                  if [ "$N" -gt 0 ]; then
                    BUNDLE="$NOW-$MODE.tar.gz"
                    rclone copy lake:lake files --files-from new.txt --transfers 4 -q        # in the cluster: free
                    tar -C files -czf bundle.tar.gz .
                    rclone copyto bundle.tar.gz "$B/bundles/$BUNDLE"                          # 1 request (or a few parts)
                    { cat catalog.txt; awk -v b="$BUNDLE" '{print $0 "\t" b}' new.txt; } | gzip > catalog.new.gz
                    rclone copyto catalog.new.gz "$B/catalog/$NOW.txt.gz"                     # 1 request
                    echo "uploaded bundles/$BUNDLE ($(du -h bundle.tar.gz | cut -f1)) and catalog/$NOW.txt.gz"
                    rm -rf files bundle.tar.gz
                  else
                    echo "nothing new: no upload"
                  fi
              volumeMounts: [{name: cfg, mountPath: /cfg}, {name: tmp, mountPath: /tmp}, {name: work, mountPath: /work}]
              resources: {requests: {cpu: 50m, memory: 96Mi}, limits: {memory: 512Mi}}
              securityContext: {runAsUser: 65534, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          containers:
            - name: heartbeat          # runs only if the bundle (an init container) succeeded
              image: ghcr.io/oracle/oci-cli:latest@sha256:2127c2f50ee1353fa78cbf538ab91ffaccc0d02b6d0b4144530cef6ee69709f5
              env: [{name: OCI_CLI_AUTH, value: instance_principal}, {name: HOME, value: /tmp}]
              command: [sh, -ec]
              args:
                - |
                  MD=$(python3 -c 'import json,urllib.request; d=json.load(urllib.request.urlopen(urllib.request.Request("http://169.254.169.254/opc/v2/instance/", headers={"Authorization": "Bearer Oracle"}))); print(d["compartmentId"], d["canonicalRegionName"])')
                  set -- $MD
                  oci monitoring metric-data post --endpoint "https://telemetry-ingestion.$2.oraclecloud.com" \
                    --metric-data "[{\"namespace\":\"platform_backup\",\"compartmentId\":\"$1\",\"name\":\"lake_sync_success\",\"dimensions\":{\"cluster\":\"oracle\"},\"datapoints\":[{\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"value\":1}]}]" >/dev/null
                  echo "heartbeat posted (lake_sync_success)"
              resources: {requests: {cpu: 20m, memory: 64Mi}, limits: {memory: 256Mi}}
              securityContext: {runAsUser: 1000, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
              volumeMounts: [{name: tmp, mountPath: /tmp}]
          securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
