# Web UIs through the k3s ingress controller (Traefik), so no tunnel is needed.
# the Mac: Lima forwards the VM's port 80 to 127.0.0.1, so *.localhost works in any browser.
# HTTP only: on Oracle the traffic is already encrypted end to end by Tailscale (WireGuard). SeaweedFS has no login and
# is deliberately not published. scripts/ui.sh (port-forward tunnels) is the fallback;
# SeaweedFS is reached only with kubectl exec + weed shell (docs/runbook.md).
---
# Airflow: http://airflow.localhost
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: airflow
  namespace: airflow
spec:
  ingressClassName: traefik
  rules:
    - host: airflow.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: airflow-api-server, port: {number: 8080}}
---
