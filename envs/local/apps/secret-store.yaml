# Where secrets come from in this environment.
# Local cluster: reads the vault with the eso-reader API key (scripts/eso-local-key.sh).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secret-store
  namespace: argocd
  labels:
    platform/git-source: "true"     # reads this repository: each environment sets which branch
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    repoURL: https://github.com/elwarrior100/platform.git
    targetRevision: main
    path: envs/local/secret-store
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true   # the ClusterSecretStore CRD only exists once external-secrets is installed
