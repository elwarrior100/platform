# The OCI Vault as a source of secrets for the whole cluster, read as the eso-reader user (read-only, only the
# platform-secrets compartment). OCIDs are identifiers, not credentials. The private key is the one Secret this
# cluster needs up front ("secret zero"), created by scripts/eso-local-key.sh, never stored in git.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: oci-vault
spec:
  conditions:
    # Only these namespaces may read secrets from the vault through this store (a new project's namespace must be
    # added on purpose, so it cannot read the platform's database passwords by accident).
    - namespaces: [data, ingest, airflow, openmetadata, monitoring, ops]
  provider:
    oracle:
      vault: ocid1.vault.oc1.eu-madrid-1.ifvpquesaago4.abwwcljrp7u2lr7vvs67dve2oqfs3qe5cu5br2n6kwva3mabshammoowrawa
      region: eu-madrid-1
      principalType: UserPrincipal
      auth:
        tenancy: ocid1.tenancy.oc1..aaaaaaaagfqmk7hp6brnz6hi6djgfbqhadeigykfwsdve6hjyrisgjgqtoya
        user: ocid1.user.oc1..aaaaaaaalukn65iuskqc2nfybakexwvzdbdo4xz4tb7tvjmzhf3n2xewng5q
        secretRef:
          privatekey:
            name: oci-eso-reader
            namespace: external-secrets
            key: privateKey
          fingerprint:
            name: oci-eso-reader
            namespace: external-secrets
            key: fingerprint
