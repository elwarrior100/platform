# Root application (app-of-apps) for the local cluster. envs/local/apps is a Kustomization: the shared
# applications (platform/argocd/apps) plus this environment's own. Apply once per cluster:
#   kubectl apply -f envs/local/root-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: bootstrap      # platform/argocd/projects/bootstrap.yaml
  source:
    repoURL: https://github.com/elwarrior100/platform.git
    targetRevision: main
    path: envs/local/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
