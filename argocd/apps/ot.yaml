apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ot
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: git@github.com:elwarrior100/modbus_data_plataform.git
    targetRevision: main
    path: platform/k8s/ot
  destination:
    server: https://kubernetes.default.svc
    namespace: ot
  syncPolicy:
    automated:
      prune: true           # a camada OT não guarda estado: pode ser apagada e recriada
      selfHeal: true
