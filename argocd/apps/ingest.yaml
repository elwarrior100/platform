apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingest
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: git@github.com:elwarrior100/modbus_data_plataform.git
    targetRevision: main
    path: platform/k8s/ingest
  destination:
    server: https://kubernetes.default.svc
    namespace: ingest
  syncPolicy:
    automated:
      prune: false          # o spool guarda amostras ainda não escritas no lakeFS
      selfHeal: true
