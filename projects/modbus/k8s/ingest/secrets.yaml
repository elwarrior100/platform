# Secrets for the ingest namespace, read from the OCI Vault by the External Secrets Operator (ADR-011).
# The vault secret <namespace>-<secret> holds every key of the Kubernetes Secret as JSON. deletionPolicy: Retain
# keeps the Secret in the cluster if this ExternalSecret is ever deleted (it holds live database passwords).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ingest-db
  namespace: ingest
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: oci-vault}
  target: {name: ingest-db, creationPolicy: Owner, deletionPolicy: Retain}
  dataFrom:
    - extract: {key: ingest-ingest-db}
# lakefs-credentials is not stored on its own: it is built from data-lakefs-auth (one source of truth).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lakefs-credentials
  namespace: ingest
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: oci-vault}
  target: {name: lakefs-credentials, creationPolicy: Owner, deletionPolicy: Retain}
  data:
    - secretKey: LAKEFS_ACCESS_KEY_ID
      remoteRef: {key: data-lakefs-auth, property: ADMIN_ACCESS_KEY_ID}
    - secretKey: LAKEFS_SECRET_ACCESS_KEY
      remoteRef: {key: data-lakefs-auth, property: ADMIN_SECRET_ACCESS_KEY}
