# Collector (OPC UA -> spool) and writer (spool -> bronze in lakeFS), in separate Deployments:
# the spool lives in PostgreSQL (ADR-006), so they no longer need to share a volume or a pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  namespace: ingest
spec:
  replicas: 1
  strategy:
    type: Recreate        # never two collectors subscribing at once (they would duplicate the work)
  selector:
    matchLabels: {app: collector}
  template:
    metadata:
      labels: {app: collector}
    spec:
      containers:
        - name: collector
          image: ghcr.io/elwarrior100/modbus-ingest:f94cf4b9f74475f6721dc6884c62708cfca1464a
          imagePullPolicy: IfNotPresent
          args: ["collect"]
          env:
            - {name: OPCUA_URL, value: "opc.tcp://ot-edge.ot.svc.cluster.local:4840/ot-gateway"}
          envFrom:
            - secretRef: {name: ingest-db}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 256Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: writer
  namespace: ingest
spec:
  replicas: 1
  strategy:
    type: Recreate        # never two writers forming batches at once
  selector:
    matchLabels: {app: writer}
  template:
    metadata:
      labels: {app: writer}
    spec:
      containers:
        - name: writer
          image: ghcr.io/elwarrior100/modbus-ingest:f94cf4b9f74475f6721dc6884c62708cfca1464a
          imagePullPolicy: IfNotPresent
          args: ["write"]
          env:
            - {name: LAKEFS_ENDPOINT, value: "http://lakefs.data.svc.cluster.local:8000"}
            # 15 min (2026-11-22, ADR-020 of the modbus project): lakeFS keeps every commit's metadata forever, so fewer
            # commits = less metadata (3x less than 5 min). ~13k rows per 15 min; the row cap only bites when catching up
            # (it was 5000, which would close a batch every ~6 min with the new signals). The silver DAG runs at :25 to match.
            - {name: BATCH_ROWS, value: "20000"}
            - {name: BATCH_AGE_S, value: "900"}
            - {name: WRITE_INTERVAL_S, value: "10"}
          envFrom:
            - secretRef: {name: ingest-db}
            - secretRef: {name: lakefs-credentials}
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {memory: 512Mi}
