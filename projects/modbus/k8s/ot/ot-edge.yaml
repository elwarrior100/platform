apiVersion: v1
kind: ConfigMap
metadata:
  name: ot-scenarios
  namespace: ot
data:
  scenarios.yaml: |
    # Scenarios scheduled at startup. Example:
    # scenarios:
    #   - {asset: PUMP-01, kind: drift, start_s: 300, duration_s: 3600}
    #   - {asset: "*", kind: comms_gap, start_s: 900, duration_s: 120}
    scenarios: []
---
apiVersion: v1
kind: Service
metadata:
  name: ot-edge
  namespace: ot
spec:
  selector:
    app: ot-edge
  ports:
    - name: modbus-tcp
      port: 502
      targetPort: 5020
    - name: control
      port: 8080
      targetPort: 8080
    - name: opcua
      port: 4840
      targetPort: 4840
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ot-edge
  namespace: ot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ot-edge
  template:
    metadata:
      labels:
        app: ot-edge
    spec:
      containers:
        - name: simulator
          image: ghcr.io/elwarrior100/modbus-ot-edge:2ef02381a5cb1cd79c9544c347ed48016afbced5
          imagePullPolicy: IfNotPresent
          env:
            - name: SCENARIOS_FILE
              value: /etc/ot/scenarios.yaml
            # weekly planned stops in Lisbon time (simulator plan.yaml) and on average one random trip per asset per
            # running day, so availability, MTBF and MTTR have real events (ADR-019 D11 of the modbus project)
            - name: PLAN
              value: builtin
            - name: TRIP_RATE_PER_DAY
              value: "1"
          ports:
            - containerPort: 5020
            - containerPort: 8080
            - containerPort: 4840
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 384Mi
          volumeMounts:
            - name: scenarios
              mountPath: /etc/ot
              readOnly: true
      volumes:
        - name: scenarios
          configMap:
            name: ot-scenarios
