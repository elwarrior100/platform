# OpenMetadata dependencies: OpenSearch only. The chart's MySQL and Airflow are disabled
# (we use the existing PostgreSQL and the native Kubernetes orchestrator). See modbus_data_plataform docs/adr/009.
mysql:
  enabled: false
airflow:
  enabled: false
opensearch:
  enabled: true
  imagePullPolicy: IfNotPresent
  opensearchJavaOpts: "-Xmx1g -Xms1g"
  persistence:
    size: 10Gi
  resources:
    requests:
      cpu: "200m"
      memory: "1500M"
    limits:
      cpu: "1"            # at most half of the 2 OCPU on Oracle (written as Kubernetes stores it, so Argo CD sees no diff)
      memory: "2048M"
