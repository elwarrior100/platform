# Values for the apache-airflow/airflow 1.22.0 chart (Airflow 3.2.2). See modbus_data_plataform docs/adr/007.
# Install: scripts/install-airflow.sh
executor: KubernetesExecutor

# The platform runs the OFFICIAL Airflow image: no project code is baked in. Each project brings its DAGs from its
# own repository (DAG bundles, below) and runs its tasks in its own image (pod_override in the DAG).
images:
  airflow:
    repository: apache/airflow
    tag: "3.2.2"
    pullPolicy: IfNotPresent

config:
  core:
    parallelism: 2                # at most 2 task pods at once on the whole platform (2 OCPU on Oracle)
  dag_processor:
    # One bundle per project. GitDagBundle (apache-airflow-providers-git, shipped in the official image) clones the
    # project repository and refreshes it every refresh_interval seconds: a pushed DAG shows up without a new image.
    # (one line: the chart copies this value into airflow.cfg)
    dag_bundle_config_list: '[{"name": "modbus", "classpath": "airflow.providers.git.bundles.git.GitDagBundle", "kwargs": {"repo_url": "https://github.com/elwarrior100/modbus_data_plataform.git", "tracking_ref": "main", "subdir": "pipelines/dags", "refresh_interval": 120}}]'

# Metadata database: the "airflow" database in the existing PostgreSQL (created by install-airflow.sh)
postgresql:
  enabled: false
data:
  metadataSecretName: airflow-metadata

# Fixed keys, generated once and kept in Secrets (otherwise they would change on every install)
fernetKeySecretName: airflow-fernet
apiSecretKeySecretName: airflow-api-secret
jwtSecretName: airflow-jwt

# What we do not use (saves memory)
redis:
  enabled: false
statsd:
  enabled: false
triggerer:
  enabled: false

apiServer:
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 1Gi}
scheduler:
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 1Gi}
dagProcessor:
  resources:
    requests: {cpu: 50m, memory: 384Mi}
    limits: {memory: 768Mi}
workers:
  kubernetes:                  # with the KubernetesExecutor these are the limits of each task pod
    resources:
      requests: {cpu: 100m, memory: 384Mi}
      limits: {memory: 1Gi}

# lakeFS connection for task pods (the Secret is copied by install-airflow.sh)
env:
  - {name: LAKEFS_ENDPOINT, value: "http://lakefs.data.svc.cluster.local:8000"}
  # Image the modbus tasks run in (published by that repository's CI, tag = commit SHA). Bump it to deploy new code.
  - {name: MODBUS_PIPELINES_IMAGE, value: "ghcr.io/elwarrior100/modbus-pipelines:44008786e1c6878d7de0155979a9c0706199f05a"}
extraEnvFrom: |
  - secretRef: {name: lakefs-credentials}

# Task pods disappear when they finish: logs must live on a volume. The volume is created by
# platform/k8s/airflow/logs-pvc.yaml (the chart would ask for ReadWriteMany, which local-path does not support).
logs:
  persistence:
    enabled: true
    existingClaim: airflow-logs-data

createUserJob:
  enabled: true                # the password comes via --set-file in install-airflow.sh, not from here
  defaultUser:
    username: admin
    email: admin@example.com
