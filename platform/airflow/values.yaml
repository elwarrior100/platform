# Values for the apache-airflow/airflow 1.22.0 chart, running Airflow 3.3.2 (newer than the chart's default 3.2.2). See modbus_data_plataform docs/adr/007.
# Installed and kept in sync by Argo CD (platform/argocd/apps/airflow.yaml).
executor: KubernetesExecutor

# The platform runs the OFFICIAL Airflow image: no project code is baked in. Each project brings its DAGs from its
# own repository (DAG bundles, below) and runs its tasks in its own image (pod_override in the DAG).
images:
  airflow:
    repository: apache/airflow
    # 3.3.2 pinned by digest (a tag can be moved; a digest cannot). 3.2.2 had CRITICAL vulnerabilities.
    tag: "3.3.2@sha256:e9982ad3f49a60418622e1baf80c34b0daf3fa5091a336cb5ee61f0cdd189371"
    pullPolicy: IfNotPresent
  # The task pods' template too: without this the chart fills it with its own default (3.2.2, CRITICAL CVEs), used by
  # any task that does not set its own image (found by scripts/deployed-images.sh, 2026-11-15).
  pod_template:
    repository: apache/airflow
    tag: "3.3.2@sha256:e9982ad3f49a60418622e1baf80c34b0daf3fa5091a336cb5ee61f0cdd189371"
    pullPolicy: IfNotPresent

config:
  core:
    parallelism: 2                # at most 2 task pods at once on the whole platform (2 OCPU on Oracle)
    # A DAG that is in git runs: new DAGs start unpaused, so the two clusters cannot drift on a click in the UI (the
    # local lake_housekeeping sat paused for days). To stop a DAG, change it in git (schedule=None), not the UI.
    dags_are_paused_at_creation: "False"
  dag_processor:
    # One bundle per project. GitDagBundle (apache-airflow-providers-git, shipped in the official image) clones the
    # project repository and refreshes it every refresh_interval seconds: a pushed DAG shows up without a new image.
    # (one line: the chart copies this value into airflow.cfg). tracking_ref is the SAME commit as MODBUS_PIPELINES_IMAGE:
    # DAG and task code move together, in one platform commit, so they can never drift apart.
    # Memory (2026-11-16): one parsing process instead of the default 2 (a handful of DAGs, parsed in seconds): ~60Mi
    parsing_processes: "1"
    # The DAG code is pinned to a commit (tracking_ref below): re-reading it every 30 s (default) only rewrites the same
    # DAGs to the database. Every 300 s; the bundle refresh every 600 s (a new commit changes this file and restarts
    # the pod anyway).
    min_file_process_interval: "300"
    dag_bundle_config_list: '[{"name": "modbus", "classpath": "airflow.providers.git.bundles.git.GitDagBundle", "kwargs": {"repo_url": "https://github.com/elwarrior100/modbus_data_plataform.git", "tracking_ref": "463626949ae974931d69be538f8c7a5d859903c5", "subdir": "pipelines/dags", "refresh_interval": 600}}]'

# Metadata database: the "airflow" database in the platform PostgreSQL (role prepared by scripts/install-airflow.sh;
# the connection Secret comes from the vault through the External Secrets Operator)
postgresql:
  enabled: false
data:
  metadataSecretName: airflow-metadata

# Fixed keys, kept in the vault and delivered as Secrets (otherwise they would change on every install)
fernetKeySecretName: airflow-fernet
apiSecretKeySecretName: airflow-api-secret
jwtSecretName: airflow-jwt

# What we do not use (saves memory)
redis:
  enabled: false
statsd:
  enabled: false
triggerer:
  enabled: false

apiServer:
  resources:
    requests: {cpu: 30m, memory: 512Mi}      # CPU measured ~3m (2026-11-17): the reservation, not the use, filled the node
    limits: {memory: 1Gi}
# Liveness probes (2026-11-16, performance review): `airflow jobs check` costs ~3.4 s of CPU per run; every 60 s on two
# pods it was ~22% of all container CPU, around the clock. Every 300 s, 3 failures: a hung scheduler is restarted
# after ~15 min instead of ~5 (silver_fresh alarms after 3 h either way).
scheduler:
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 1Gi}
  livenessProbe: {initialDelaySeconds: 10, timeoutSeconds: 30, failureThreshold: 3, periodSeconds: 300}
dagProcessor:
  resources:
    requests: {cpu: 50m, memory: 384Mi}
    limits: {memory: 768Mi}
  livenessProbe: {initialDelaySeconds: 10, timeoutSeconds: 30, failureThreshold: 3, periodSeconds: 300}
# Task pods (KubernetesExecutor) run as airflow-worker, which the chart binds to the pod-launcher role (create/delete
# pods, pods/exec in this namespace). Our tasks never call the Kubernetes API (Airflow 3 tasks talk to the API server
# over HTTP), so they get no token (2026-11-17 audit: a task could exec into the scheduler and read its secrets).
workers:
  serviceAccount:              # chart 1.22.0 reads this key (workers.kubernetes.serviceAccount is not wired yet)
    automountServiceAccountToken: false
  # The lakeFS key (Secret lakefs-credentials) goes to the TASK pods only (2026-11-17 audit: through the global
  # extraEnvFrom the scheduler, API server and DAG processor held it too, and none of them talks to lakeFS).
  env:
    - {name: LAKEFS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: lakefs-credentials, key: LAKEFS_ACCESS_KEY_ID}}}
    - {name: LAKEFS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: lakefs-credentials, key: LAKEFS_SECRET_ACCESS_KEY}}}
    # OpenMetadata (catalog and G2 history, best effort): optional, so a missing token never blocks a task
    - {name: OPENMETADATA_URL, value: "http://openmetadata.openmetadata.svc.cluster.local:8585"}
    - {name: OPENMETADATA_TOKEN, valueFrom: {secretKeyRef: {name: openmetadata-bot, key: OPENMETADATA_TOKEN, optional: true}}}
  kubernetes:                  # with the KubernetesExecutor these are the limits of each task pod
    resources:
      requests: {cpu: 100m, memory: 384Mi}
      limits: {memory: 1Gi}

# lakeFS endpoint for task pods (the key comes from workers.env above: Secret lakefs-credentials, from the vault)
env:
  - {name: LAKEFS_ENDPOINT, value: "http://lakefs.data.svc.cluster.local:8000"}
  # Image the modbus tasks run in (published by that repository's CI, tag = commit SHA). Bump it to deploy new code.
  - {name: MODBUS_PIPELINES_IMAGE, value: "ghcr.io/elwarrior100/modbus-pipelines:463626949ae974931d69be538f8c7a5d859903c5"}

# Task pods disappear when they finish: logs must live on a volume. The volume is created by
# platform/k8s/airflow/logs-pvc.yaml (the chart would ask for ReadWriteMany, which local-path does not support).
logs:
  persistence:
    enabled: true
    existingClaim: airflow-logs-data

# Installed by Argo CD (platform/argocd/apps/airflow.yaml), so the chart's Helm hooks become Argo CD hooks.
migrateDatabaseJob:
  useHelmHooks: false
  applyCustomEnv: false
  jobAnnotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation

# The admin password comes from the airflow-admin Secret (created by the External Secrets Operator from the vault):
# Kubernetes expands $(ADMIN_PASSWORD) from the container env, so the password is never written in git or values.
createUserJob:
  enabled: true
  useHelmHooks: false
  applyCustomEnv: false
  jobAnnotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  env:
    - name: ADMIN_PASSWORD
      valueFrom: {secretKeyRef: {name: airflow-admin, key: password}}
  defaultUser:
    username: admin
    email: admin@example.com
    password: "$(ADMIN_PASSWORD)"
