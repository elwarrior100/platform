# Values for the apache-airflow/airflow 1.22.0 chart (Airflow 3.2.2). See modbus_data_plataform docs/adr/007.
# Install: scripts/install-airflow.sh
executor: KubernetesExecutor

images:
  airflow:
    repository: localhost/airflow-pipelines     # our own image, built with scripts/build-image.sh
    tag: "0.4.0"
    pullPolicy: IfNotPresent

# Metadata database: the "airflow" database in the existing PostgreSQL (created by install-airflow.sh)
postgresql:
  enabled: false
data:
  metadataSecretName: airflow-metadata

# Fixed keys, generated once and kept in Secrets (otherwise they would change on every install)
fernetKeySecretName: airflow-fernet
apiSecretKeySecretName: airflow-api-secret
jwtSecretName: airflow-jwt

# What we do not use (saves memory)
redis:
  enabled: false
statsd:
  enabled: false
triggerer:
  enabled: false

apiServer:
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 1Gi}
scheduler:
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 1Gi}
dagProcessor:
  resources:
    requests: {cpu: 50m, memory: 384Mi}
    limits: {memory: 768Mi}
workers:
  kubernetes:                  # with the KubernetesExecutor these are the limits of each task pod
    resources:
      requests: {cpu: 100m, memory: 384Mi}
      limits: {memory: 1Gi}

# lakeFS connection for task pods (the Secret is copied by install-airflow.sh)
env:
  - {name: LAKEFS_ENDPOINT, value: "http://lakefs.data.svc.cluster.local:8000"}
extraEnvFrom: |
  - secretRef: {name: lakefs-credentials}

# Task pods disappear when they finish: logs must live on a volume. The volume is created by
# platform/k8s/airflow/logs-pvc.yaml (the chart would ask for ReadWriteMany, which local-path does not support).
logs:
  persistence:
    enabled: true
    existingClaim: airflow-logs-data

createUserJob:
  enabled: true                # the password comes via --set-file in install-airflow.sh, not from here
  defaultUser:
    username: admin
    email: admin@example.com
