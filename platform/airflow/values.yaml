# Values for the apache-airflow/airflow 1.22.0 chart, running Airflow 3.3.2 (newer than the chart's default 3.2.2). See modbus_data_plataform docs/adr/007.
# Installed and kept in sync by Argo CD (platform/argocd/apps/airflow.yaml).
executor: KubernetesExecutor

# The platform runs the OFFICIAL Airflow image: no project code is baked in. Each project brings its DAGs from its
# own repository (DAG bundles, below) and runs its tasks in its own image (pod_override in the DAG).
images:
  airflow:
    repository: apache/airflow
    # 3.3.2 pinned by digest (a tag can be moved; a digest cannot). 3.2.2 had CRITICAL vulnerabilities.
    tag: "3.3.2@sha256:e9982ad3f49a60418622e1baf80c34b0daf3fa5091a336cb5ee61f0cdd189371"
    pullPolicy: IfNotPresent

config:
  core:
    parallelism: 2                # at most 2 task pods at once on the whole platform (2 OCPU on Oracle)
    # A DAG that is in git runs: new DAGs start unpaused, so the two clusters cannot drift on a click in the UI (the
    # local lake_housekeeping sat paused for days). To stop a DAG, change it in git (schedule=None), not the UI.
    dags_are_paused_at_creation: "False"
  dag_processor:
    # One bundle per project. GitDagBundle (apache-airflow-providers-git, shipped in the official image) clones the
    # project repository and refreshes it every refresh_interval seconds: a pushed DAG shows up without a new image.
    # (one line: the chart copies this value into airflow.cfg). tracking_ref is the SAME commit as MODBUS_PIPELINES_IMAGE:
    # DAG and task code move together, in one platform commit, so they can never drift apart.
    dag_bundle_config_list: '[{"name": "modbus", "classpath": "airflow.providers.git.bundles.git.GitDagBundle", "kwargs": {"repo_url": "https://github.com/elwarrior100/modbus_data_plataform.git", "tracking_ref": "50011b23a9433e04bf3cc2df1d99f4388f429667", "subdir": "pipelines/dags", "refresh_interval": 120}}]'

# Metadata database: the "airflow" database in the platform PostgreSQL (role prepared by scripts/install-airflow.sh;
# the connection Secret comes from the vault through the External Secrets Operator)
postgresql:
  enabled: false
data:
  metadataSecretName: airflow-metadata

# Fixed keys, kept in the vault and delivered as Secrets (otherwise they would change on every install)
fernetKeySecretName: airflow-fernet
apiSecretKeySecretName: airflow-api-secret
jwtSecretName: airflow-jwt

# What we do not use (saves memory)
redis:
  enabled: false
statsd:
  enabled: false
triggerer:
  enabled: false

apiServer:
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 1Gi}
scheduler:
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 1Gi}
dagProcessor:
  resources:
    requests: {cpu: 50m, memory: 384Mi}
    limits: {memory: 768Mi}
workers:
  kubernetes:                  # with the KubernetesExecutor these are the limits of each task pod
    resources:
      requests: {cpu: 100m, memory: 384Mi}
      limits: {memory: 1Gi}

# lakeFS connection for task pods (Secret lakefs-credentials, derived from data-lakefs-auth in the vault)
env:
  - {name: LAKEFS_ENDPOINT, value: "http://lakefs.data.svc.cluster.local:8000"}
  # Image the modbus tasks run in (published by that repository's CI, tag = commit SHA). Bump it to deploy new code.
  - {name: MODBUS_PIPELINES_IMAGE, value: "ghcr.io/elwarrior100/modbus-pipelines:50011b23a9433e04bf3cc2df1d99f4388f429667"}
extraEnvFrom: |
  - secretRef: {name: lakefs-credentials}

# Task pods disappear when they finish: logs must live on a volume. The volume is created by
# platform/k8s/airflow/logs-pvc.yaml (the chart would ask for ReadWriteMany, which local-path does not support).
logs:
  persistence:
    enabled: true
    existingClaim: airflow-logs-data

# Installed by Argo CD (platform/argocd/apps/airflow.yaml), so the chart's Helm hooks become Argo CD hooks.
migrateDatabaseJob:
  useHelmHooks: false
  applyCustomEnv: false
  jobAnnotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation

# The admin password comes from the airflow-admin Secret (created by the External Secrets Operator from the vault):
# Kubernetes expands $(ADMIN_PASSWORD) from the container env, so the password is never written in git or values.
createUserJob:
  enabled: true
  useHelmHooks: false
  applyCustomEnv: false
  jobAnnotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  env:
    - name: ADMIN_PASSWORD
      valueFrom: {secretKeyRef: {name: airflow-admin, key: password}}
  defaultUser:
    username: admin
    email: admin@example.com
    password: "$(ADMIN_PASSWORD)"
