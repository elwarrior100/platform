# Volume for Airflow task logs. Created here (not by the chart) because the chart asks for
# ReadWriteMany and the k3s local-path provisioner only supports ReadWriteOnce. Enough: everything runs on one node.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airflow-logs-data
  namespace: airflow
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
