# Secrets for the airflow namespace, read from the OCI Vault by the External Secrets Operator (ADR-011).
# The vault secret <namespace>-<secret> holds every key of the Kubernetes Secret as JSON.
# creationPolicy: Orphan: the Secret has no owner, so deleting this ExternalSecret (or the operator) does NOT delete
# the Secret, which holds live database passwords. deletionPolicy: Retain: if the value disappears from the vault,
# the last known value is kept in the cluster.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-metadata
  namespace: airflow
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: oci-vault}
  target: {name: airflow-metadata, creationPolicy: Orphan, deletionPolicy: Retain}
  dataFrom:
    - extract: {key: airflow-airflow-metadata}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-fernet
  namespace: airflow
spec:
