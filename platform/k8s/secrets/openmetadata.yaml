# Secrets for the openmetadata namespace, read from the OCI Vault by the External Secrets Operator (ADR-011).
# The vault secret <namespace>-<secret> holds every key of the Kubernetes Secret as JSON. deletionPolicy: Retain
# keeps the Secret in the cluster if this ExternalSecret is ever deleted (it holds live database passwords).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openmetadata-db
  namespace: openmetadata
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: oci-vault}
  target: {name: openmetadata-db, creationPolicy: Owner, deletionPolicy: Retain}
  dataFrom:
    - extract: {key: openmetadata-openmetadata-db}
