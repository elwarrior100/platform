# Block the cloud metadata endpoint (169.254.169.254) for every pod in every workload namespace. On Oracle that endpoint
# hands out instance-principal credentials that can read the whole vault, so only two namespaces, NOT listed here, may
# reach it: external-secrets (the operator) and backup (the nightly dump). The exemption is the namespace, not a pod
# label, so a workload cannot grant itself access. Everything else is still allowed: only that one address is removed.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-cloud-metadata
  namespace: data
spec:
  podSelector: {}                                   # every pod in this namespace, no exceptions
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}          # any pod in the cluster (DNS, Postgres, lakeFS...)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [169.254.169.254/32]
---
