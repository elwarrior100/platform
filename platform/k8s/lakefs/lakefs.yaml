apiVersion: v1
kind: Service
metadata:
  name: lakefs
  namespace: data
spec:
  selector:
    app: lakefs
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lakefs
  namespace: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lakefs
  template:
    metadata:
      labels:
        app: lakefs
    spec:
      containers:
        - name: lakefs
          image: treeverse/lakefs:1.86.0@sha256:fb7a0d90f77e3f893e8b8c6f3be131c090f6f0160c2d6c7784c4378cf7e66ea1   # pinned by digest, same build on both clusters
          args: ["run"]
          ports:
            - containerPort: 8000
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-auth, key: LAKEFS_DB_PASSWORD}
            - name: LAKEFS_DATABASE_TYPE
              value: postgres
            - name: LAKEFS_DATABASE_POSTGRES_CONNECTION_STRING
              value: postgres://lakefs:$(DB_PASSWORD)@postgres:5432/lakefs?sslmode=disable
            - name: LAKEFS_AUTH_ENCRYPT_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: lakefs-auth, key: AUTH_ENCRYPT_SECRET_KEY}
            - name: LAKEFS_INSTALLATION_USER_NAME
              value: admin
            - name: LAKEFS_INSTALLATION_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: {name: lakefs-auth, key: ADMIN_ACCESS_KEY_ID}
            - name: LAKEFS_INSTALLATION_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: lakefs-auth, key: ADMIN_SECRET_ACCESS_KEY}
            - name: LAKEFS_BLOCKSTORE_TYPE
              value: s3
            - name: LAKEFS_BLOCKSTORE_S3_ENDPOINT
              value: http://seaweedfs:8333
            - name: LAKEFS_BLOCKSTORE_S3_FORCE_PATH_STYLE
              value: "true"
            - name: LAKEFS_BLOCKSTORE_S3_DISCOVER_BUCKET_REGION
              value: "false"
            - name: LAKEFS_BLOCKSTORE_S3_REGION
              value: us-east-1
            - name: LAKEFS_BLOCKSTORE_S3_DISABLE_PRE_SIGNED
              value: "true"
            - name: LAKEFS_BLOCKSTORE_S3_DISABLE_PRE_SIGNED_UI
              value: "true"
            - name: LAKEFS_BLOCKSTORE_S3_CREDENTIALS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: {name: seaweedfs-auth, key: S3_ACCESS_KEY}
            - name: LAKEFS_BLOCKSTORE_S3_CREDENTIALS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: seaweedfs-auth, key: S3_SECRET_KEY}
            - name: LAKEFS_EMAIL_SUBSCRIPTION_ENABLED
              value: "false"
            # Memory (2026-11-16): in-memory cache of committed metadata (sstables), default 400 MB per reader; 100 MB is
            # plenty for this lake (the on-disk cache stays). Idle Postgres connections 25 -> 5 (open max stays 25).
            - name: LAKEFS_COMMITTED_SSTABLE_MEMORY_CACHE_SIZE_BYTES
              value: "100000000"
            - name: LAKEFS_DATABASE_POSTGRES_MAX_IDLE_CONNECTIONS
              value: "5"
            # Metadata growth (2026-11-17): each commit rewrites the "ranges" (index pieces) that changed. With the default
            # 50,000 entries per range, the whole lake fit in ONE range (~0.5 MB) and every commit (2 a minute: the
            # batch commit and its merge) rewrote it: _lakefs/ was 82% of the lake (821 MB in 3 days) and commits are
            # never garbage-collected. ~1,000 entries per range: a commit rewrites only the last small piece.
            - name: LAKEFS_COMMITTED_PERMANENT_RANGE_RAGGEDNESS_ENTRIES
              value: "1000"
            - name: LAKEFS_STATS_ENABLED
              value: "false"
          readinessProbe:
            httpGet:
              path: /_health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: 256Mi
              cpu: 50m          # measured ~10m
            limits:
              memory: 1Gi
