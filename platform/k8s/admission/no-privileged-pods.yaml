# A privileged pod, or one sharing the host's PID/IPC namespaces or mounting host paths, can step out of its
# container onto the node, and from there reach the cloud metadata endpoint (and so the whole vault). No such pods
# outside kube-system; node-exporter in monitoring may mount host paths (read-only /proc, /sys, /) and nothing else.
# 2026-11-17 audit: ephemeral containers (`kubectl debug`) are checked too, added Linux capabilities are refused, and
# the monitoring exception is only for the node-exporter pods.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: no-privileged-pods
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
  variables:
    - name: containers
      expression: >-
        object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : []) +
        (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
  validations:
    - expression: "variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged) || c.securityContext.privileged == false)"
      message: "privileged containers are not allowed outside kube-system"
    - expression: >-
        variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.capabilities) ||
        !has(c.securityContext.capabilities.add) || size(c.securityContext.capabilities.add) == 0)
      message: "adding Linux capabilities is not allowed outside kube-system"
    - expression: "(!has(object.spec.hostPID) || object.spec.hostPID == false) && (!has(object.spec.hostIPC) || object.spec.hostIPC == false)"
      message: "hostPID / hostIPC are not allowed outside kube-system"
    - expression: >-
        (namespaceObject.metadata.name == 'monitoring' && has(object.metadata.labels) &&
         object.metadata.labels.exists(k, k == 'app.kubernetes.io/name') &&
         object.metadata.labels['app.kubernetes.io/name'] == 'prometheus-node-exporter') ||
        !has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.hostPath))
      message: "hostPath volumes are not allowed outside kube-system (and monitoring, for node-exporter)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: no-privileged-pods
spec:
  policyName: no-privileged-pods
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - {key: kubernetes.io/metadata.name, operator: NotIn, values: [kube-system]}
