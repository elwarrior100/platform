# The secret store is shared (one instance principal can read the whole vault), so it cannot limit WHICH secrets a
# namespace reads. This rule does: an ExternalSecret may only read vault secrets named after its own namespace
# ("<namespace>-..."). The only exceptions are the derived credentials that already exist on purpose:
#   airflow, ingest -> data-lakefs-auth (lakefs-credentials)      backup -> data-postgres-auth (the dump job)
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: externalsecret-own-prefix
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [external-secrets.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [externalsecrets]
  variables:
    - name: ns
      expression: "object.metadata.namespace"
    - name: allowed
      expression: >-
        {"airflow": ["data-lakefs-auth"], "ingest": ["data-lakefs-auth"], "backup": ["data-postgres-auth"]}
    - name: keys
      expression: >-
        (has(object.spec.data) ? object.spec.data.map(d, d.remoteRef.key) : []) +
        (has(object.spec.dataFrom) ? object.spec.dataFrom.filter(d, has(d.extract)).map(d, d.extract.key) : [])
  validations:
    - expression: >-
        variables.keys.all(k, k.startsWith(variables.ns + "-") ||
          (variables.ns in variables.allowed && k in variables.allowed[variables.ns]))
      messageExpression: "'namespace ' + variables.ns + ' may only read vault secrets named ' + variables.ns + '-...'"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: externalsecret-own-prefix
spec:
  policyName: externalsecret-own-prefix
  validationActions: [Deny]
