apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: data
data:
  10-lakefs.sh: |
    #!/bin/sh
    set -e
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d postgres <<SQL
    CREATE ROLE lakefs LOGIN PASSWORD '${LAKEFS_DB_PASSWORD}';
    CREATE DATABASE lakefs OWNER lakefs;
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: data
spec:
  selector:
    app: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: data
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      priorityClassName: platform-data        # kubelet memory eviction takes it last (it holds the spool and the lakeFS metadata);
                                              # the kernel OOM killer follows QoS instead, and this pod is Burstable
      terminationGracePeriodSeconds: 60       # time to checkpoint on shutdown
      containers:
        - name: postgres
          # pinned by digest: "latest-pg17" alone let the two clusters run different builds (TimescaleDB 2.31 vs 2.32)
          image: timescale/timescaledb:latest-pg17@sha256:6a6b7d7a346d7c6be03a310c240706f3bbc6d7adbdf3fbc07823570b34337f5e
          # WAL (2026-11-16, performance review): ~16 GB of WAL in 47 h for a few MB of data, ~95% of it full-page images
          # (each event is inserted, then updated with its batch_id; random UUID index pages). lz4 compresses those
          # images and a 15 min checkpoint writes each hot page less often. Crash recovery replays a bit more WAL
          # (seconds). The nightly pg_dump is unaffected.
          args: ["-c", "wal_compression=lz4", "-c", "checkpoint_timeout=15min", "-c", "max_wal_size=2GB"]
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: postgres-auth
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: 512Mi
              cpu: 200m
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 20Gi
