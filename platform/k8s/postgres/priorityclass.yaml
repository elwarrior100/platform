# Data services (Postgres, SeaweedFS) get the highest priority among workloads: under memory pressure on the
# 12 GB Oracle node, the kubelet evicts lower-priority pods (task pods, OpenSearch) first.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: platform-data
value: 1000000
globalDefault: false
description: Stateful data services of the platform (Postgres, SeaweedFS)
---
# Batch jobs that can always run again later (lakeFS GC, the lake restore drill): the lowest priority, so under
# memory pressure they are the first to go, and they never preempt anything to get scheduled.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: platform-batch
value: -100
globalDefault: false
preemptionPolicy: Never
description: Re-runnable batch jobs of the platform (lakeFS GC, restore drill); evicted first, never preempt
