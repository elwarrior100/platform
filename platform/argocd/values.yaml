# Values for the argo/argo-cd 10.11.1 chart (Argo CD v3.5.6).
# Install: scripts/install-argocd.sh
configs:
  params:
    server.insecure: true        # no TLS on the service; access is via port-forward (no Ingress)

dex:
  enabled: false                 # no external login (SSO)
notifications:
  enabled: false

controller:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 768Mi}
server:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}
repoServer:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 384Mi}
redis:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 128Mi}
applicationSet:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 128Mi}
