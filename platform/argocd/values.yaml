# Values for the argo/argo-cd 10.11.1 chart (Argo CD v3.5.6).
# Bootstrap with scripts/install-argocd.sh; afterwards Argo CD manages itself (platform/argocd/apps/argocd.yaml).
configs:
  params:
    server.insecure: true        # no TLS on the service; reached through the Traefik Ingress (envs/<env>/ingress) or port-forward

dex:
  enabled: false                 # no external login (SSO)
notifications:
  enabled: false

controller:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 768Mi}
server:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}
repoServer:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 384Mi}
redis:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 128Mi}
applicationSet:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 128Mi}
