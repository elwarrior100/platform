# Cluster-wide admission rules (built-in ValidatingAdmissionPolicy).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: admission
  namespace: argocd
  labels:
    platform/git-source: "true"     # reads this repository: each environment sets which branch
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    repoURL: https://github.com/elwarrior100/platform.git
    targetRevision: main
    path: platform/k8s/admission
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
