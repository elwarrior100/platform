# One project = one folder under projects/<project>/k8s/<component>/. This ApplicationSet creates one Argo CD
# application per component without touching the platform. The application name and namespace are the
# component name (ingest, ot), the same as before the split.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: projects
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/elwarrior100/platform.git
        revision: main
        directories:
          - path: projects/*/k8s/*
  syncPolicy:
    preserveResourcesOnDeletion: true   # deleting the ApplicationSet never deletes a project's workloads
  template:
    metadata:
      name: "{{ .path.basename }}"
      namespace: argocd
      labels:
        project: "{{ index .path.segments 1 }}"
      annotations:
        argocd.argoproj.io/sync-wave: "2"     # after the platform (wave 1)
    spec:
      project: "{{ index .path.segments 1 }}"   # the AppProject named after the project (platform/argocd/projects)
      source:
        repoURL: https://github.com/elwarrior100/platform.git
        targetRevision: main
        path: "{{ .path.path }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .path.basename }}"
      syncPolicy:
        automated:
          prune: false        # the ingest spool holds samples not yet written to lakeFS
          selfHeal: true
