apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data
  namespace: argocd
  labels:
    platform/git-source: "true"     # reads this repository: each environment sets which branch
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/elwarrior100/platform.git
    targetRevision: main
    path: platform/k8s
    directory:
      recurse: true
      include: "{postgres/*.yaml,seaweedfs/*.yaml,lakefs/*.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated:
      prune: false          # data: a manifest deleted from git must not delete the database
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates   # fields filled in by Kubernetes (volumeMode, status)
