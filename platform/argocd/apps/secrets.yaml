# Platform Secrets as ExternalSecrets (data, airflow, openmetadata). Project secrets live in their project folder.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/elwarrior100/platform.git
    targetRevision: main
    path: platform/k8s/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: false          # never remove a database password because a file moved
      selfHeal: true
