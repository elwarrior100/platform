# Where secrets come from, per environment. This cluster (local) reads with the eso-reader API key; the Oracle
# cluster will point at envs/oracle/secret-store (instance principal, no key).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secret-store
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/elwarrior100/platform.git
    targetRevision: main
    path: envs/local/secret-store
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true   # the ClusterSecretStore CRD only exists once external-secrets is installed
