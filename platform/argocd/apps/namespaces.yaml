apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespaces
  namespace: argocd
  labels:
    platform/git-source: "true"     # reads this repository: each environment sets which branch
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  source:
    repoURL: https://github.com/elwarrior100/platform.git
    targetRevision: main
    path: platform/k8s
    directory:
      include: "00-namespaces.yaml"
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false          # never delete a namespace (it would take the data with it)
      selfHeal: true
