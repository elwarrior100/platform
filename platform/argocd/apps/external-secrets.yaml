# External Secrets Operator: turns ExternalSecret objects into Kubernetes Secrets read from the OCI Vault.
# Installed before everything that needs secrets (wave 0). See modbus_data_plataform docs/adr/011.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.15.0
    helm:
      valuesObject:
        installCRDs: true
        # pinned by digest (the build both clusters ran on 2026-11-15); update with the chart version
        image: {tag: "v2.15.0@sha256:6888f243e5f8f7592c6d7fae2a5547c9e33531441b47b53807b9093b25a00e31"}
        resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 256Mi}}
        webhook:
          image: {tag: "v2.15.0@sha256:6888f243e5f8f7592c6d7fae2a5547c9e33531441b47b53807b9093b25a00e31"}
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
        certController:
          image: {tag: "v2.15.0@sha256:6888f243e5f8f7592c6d7fae2a5547c9e33531441b47b53807b9093b25a00e31"}
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true      # the CRDs are too large for client-side apply annotations
