# kube-prometheus-stack 93.3.0, sized for the 12 GB Oracle node: Prometheus + Grafana + the standard Kubernetes
# dashboards and alert rules. Alerts show in Grafana and Prometheus; the alarms that must fire even when the whole VM
# is down are OCI Monitoring alarms outside the VM (terraform/oracle/alarms.tf).
# Images pinned by digest (2026-11-15: the exact builds both clusters ran), not only by chart version: a tag can be
# moved, a digest cannot. On a chart upgrade, update the digests too (helm template ... | grep image: shows them).
crds:
  enabled: true
alertmanager:
  enabled: false                 # no mail account yet: external alerting is done by OCI alarms
grafana:
  admin:
    existingSecret: grafana-admin          # from the vault (monitoring-grafana-admin-<env>)
    userKey: admin-user
    passwordKey: admin-password
  defaultDashboardsTimezone: utc
  persistence:
    enabled: false               # dashboards are provisioned from git; nothing to keep
  resources:
    requests: {cpu: 20m, memory: 192Mi}
    limits: {memory: 512Mi}        # 256Mi was OOM-killed at start-up (Grafana 12 loads its plugins)
  image:
    sha: 54e297ac67e2b72572f926892f4e06074dc4f79f2a56ed9a9ca9a88a46f28733
  sidecar:
    image:
      sha: 52d311dcedd587421a236c4d6c621f05614c40a51386e955e0699dca97ec0880
    datasources:
      initDatasources: true
      watchMethod: LIST          # the init container gets the sidecar's method: LIST loads once and exits (WATCH never ends)
  testFramework:
    enabled: false
  # Memory (2026-11-16): the datasources never change at run time, so they load once in an init container instead of a
  # sidecar watching all day (~85Mi). Grafana's own alerting holds no rules here (alarms are OCI's, rules are
  # Prometheus'): off, so it does not run its scheduler and state store. Dashboards are unchanged.
  grafana.ini:
    unified_alerting:
      enabled: false
prometheus:
  prometheusSpec:
    scrapeInterval: 60s
    retention: 2d                  # 3d -> 2d (2026-11-15): Grafana is for the last hours; history lives in OCI alarms
    retentionSize: 1500MB
    resources:
      requests: {cpu: 50m, memory: 400Mi}    # measured ~20m
      limits: {cpu: 500m, memory: 1Gi}       # a WAL replay after a restart cannot take the whole node
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources: {requests: {storage: 4Gi}}
    image:
      sha: 9764044e09eb2c9e1abdb12d0f0188d4efb7384b0262d3c080f0fc59045c89ba
prometheusOperator:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 192Mi}
  image:
    sha: 7986c2afa118c9dea07d01c5e1a29555824582e92f6ee8607591d1a7178acf29
  prometheusConfigReloader:
    image:
      sha: cc74ddedad4ab1c49446971f6d51302ad4303d8660a2018af925c7f62c114304
  admissionWebhooks:
    patch:
      image:
        sha: 8009b04f9873f7279b5adee37fdd03b6a9aa7b6751d4f69fde2683010e41cd1f
kube-state-metrics:
  resources:
    requests: {cpu: 10m, memory: 48Mi}
    limits: {memory: 128Mi}
  image:
    sha: sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
prometheus-node-exporter:
  hostNetwork: false             # the admission policies forbid hostNetwork and hostPID outside kube-system;
  hostPID: false                 # host CPU, memory, disk and network metrics still come from /proc and /sys
  resources:
    requests: {cpu: 10m, memory: 24Mi}
    limits: {memory: 64Mi}
  image:
    digest: sha256:8c9bac11973b94b59be88d6e11fee4429aa743c8846cdc75d65b18db33f6a106
# k3s runs these inside one process and does not expose them to Prometheus: scraping them would only raise false alerts
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

# Memory (2026-11-16): ~43k of Prometheus' 125k series were latency histograms of k3s internals (API server, etcd/kine,
# work queues) that no dashboard or alarm of ours reads (workqueue_queue_duration_seconds stays: the API server dashboard uses it); k3s even exposes them twice (its kubelet endpoint carries the
# API server's metrics). Dropped at scrape time. Kept: apiserver_request_sli_duration_seconds_bucket (the API server
# SLO alert rules use it). The chart's own default drops are repeated here, because a list in values replaces it.
kubeApiServer:
  serviceMonitor:
    metricRelabelings:
      - action: drop                 # chart default: fewer buckets
        regex: (etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?
        sourceLabels: [__name__, le]
      - action: drop
        regex: '(apiserver_request_duration_seconds|etcd_request_duration_seconds|apiserver_watch_list_duration_seconds|apiserver_response_sizes|apiserver_watch_cache_read_wait_seconds|apiserver_request_body_size_bytes|apiserver_watch_events_sizes|workqueue_work_duration_seconds)_bucket'
        sourceLabels: [__name__]
kubelet:
  serviceMonitor:
    metricRelabelings:
      - action: drop                 # chart default: fewer buckets of kubelet storage operations
        sourceLabels: [__name__, le]
        regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
      - action: drop
        regex: '(apiserver_request_duration_seconds|etcd_request_duration_seconds|apiserver_watch_list_duration_seconds|apiserver_response_sizes|apiserver_watch_cache_read_wait_seconds|apiserver_request_body_size_bytes|apiserver_watch_events_sizes|workqueue_work_duration_seconds)_bucket'
        sourceLabels: [__name__]
