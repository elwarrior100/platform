# Checks every push and pull request before Argo CD ever sees it: secrets scan, rendered Kustomize for both
# environments, Kubernetes manifests against their schemas, Terraform format/validate, and shell scripts.
# Tools are pinned by version and checksum; actions by commit SHA.
name: validate

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"      # Mondays: has Oracle changed the service ranges the egress policies allow?
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oci-ranges:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: OCI service ranges in the backup and ops egress policies
        run: ./scripts/check-oci-cidrs.sh

  validate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0                 # gitleaks scans the whole history
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.3
      - name: tools (pinned by checksum)
        run: |
          curl -sSL -o kc.tgz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-arm64.tar.gz
          echo "1f53fc8e81258197a35e8603054162a5af1de8c5af13746c71ab680d9534ed87  kc.tgz" | sha256sum -c -
          curl -sSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_arm64.tar.gz
          echo "e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080  gl.tgz" | sha256sum -c -
          curl -sSL -o tv.tgz https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-ARM64.tar.gz
          echo "ab9d51f86e6a5fb936f605faff6b593ac51bc378fff4d3e8b9d58358b9c367c3  tv.tgz" | sha256sum -c -
          tar -xzf kc.tgz kubeconform && tar -xzf gl.tgz gitleaks && tar -xzf tv.tgz trivy
          sudo mv kubeconform gitleaks trivy /usr/local/bin/
          sudo apt-get install -y -qq shellcheck >/dev/null
      - name: bootstrap order (the root application's project must be created by install-argocd.sh)
        run: |
          for env in local oracle; do
            p=$(awk '/^  project:/ {print $2}' envs/$env/root-app.yaml)
            grep -q "projects/$p.yaml" scripts/install-argocd.sh || { echo "root ($env) is in project $p, which install-argocd.sh does not create"; exit 1; }
          done
      - name: lakeFS GC keeps history at least as long as the database dumps live (else an older dump points at swept objects)
        run: |
          gc=$(grep -o '"default_retention_days":[0-9]*' scripts/lakefs-repo.sh | head -1 | cut -d: -f2)
          # only the DELETE rule counts (the bucket also has an ABORT rule for unfinished multipart uploads)
          dumps=$(awk '/resource "oci_objectstorage_object_lifecycle_policy" "backups"/,/^}/' terraform/oracle/backups.tf \
            | awk '/action *= *"DELETE"/{d=1} d && /time_amount/{print $NF; exit}')
          echo "GC retention: $gc days, dump lifecycle: $dumps days"
          [ -n "$gc" ] && [ -n "$dumps" ] && [ "$gc" -ge "$dumps" ] || { echo "GC retention must be >= the dump lifecycle"; exit 1; }
      - name: secrets (gitleaks, full history)
        run: gitleaks git . --no-banner --redact
      - name: kustomize (both environments)
        run: |
          kubectl kustomize envs/local/apps > /tmp/local.yaml
          kubectl kustomize envs/oracle/apps > /tmp/oracle.yaml
          grep -c '^kind:' /tmp/local.yaml /tmp/oracle.yaml
      - name: manifests (kubeconform)
        run: |
          kubeconform -strict -summary -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            platform/k8s projects platform/argocd/apps platform/argocd/projects \
            envs/local/secret-store envs/oracle/secret-store envs/oracle/backup envs/oracle/ops envs/oracle/lakefs-gc \
            envs/local/ingress envs/oracle/ingress /tmp/local.yaml /tmp/oracle.yaml
      - name: terraform (fmt + validate, no backend)
        working-directory: terraform/oracle
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false >/dev/null
          terraform validate
      - name: misconfigurations (trivy config; CRITICAL fails, HIGH is reported)
        run: |
          trivy config --quiet --exit-code 1 --severity CRITICAL --skip-dirs .github,docs,scripts .
          for d in envs/oracle/backup envs/oracle/ops; do   # the namespaces with the instance principal: HIGH fails too
            trivy config --quiet --exit-code 1 --severity HIGH,CRITICAL "$d"
          done
          trivy config --quiet --exit-code 0 --severity HIGH --skip-dirs .github,docs,scripts . | grep -E '^│ .* [1-9][0-9]* +│$' || true
      - name: shell scripts (shellcheck, errors)
        run: shellcheck -x -S error scripts/*.sh envs/oracle/*.sh
