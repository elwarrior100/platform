# Images the platform builds itself (today only lakefs-gc). On main, when images/ changes: build natively on arm64,
# scan with Trivy (fails on CRITICAL with a fix), then push to GHCR with SBOM and provenance, tagged with the commit
# SHA. Actions pinned by commit SHA. Deploying is a separate step: the tag is set in the manifests (Argo CD applies it).
name: images

on:
  push:
    branches: [main]
    paths: [images/**, .github/workflows/images.yml]
  schedule:
    - cron: "23 6 * * 1"     # Mondays: re-scan what is DEPLOYED (new CVEs; expired entries in .trivyignore)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Weekly: re-scan EVERY image the platform deploys (scripts/deployed-images.sh: manifests + rendered charts).
  # Our own image (lakefs-gc) fails CI on a CRITICAL with a fix that is not accepted in its .trivyignore (whose
  # entries expire); third-party images are REPORTED in the job summary (CRITICAL with a fix, per image), because
  # only their vendors can fix them: the signal is "time to upgrade that chart", not a red build every week.
  rescan-deployed:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - name: trivy (pinned by checksum)
        run: |
          curl -sSL -o tv.tgz https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-ARM64.tar.gz
          echo "ab9d51f86e6a5fb936f605faff6b593ac51bc378fff4d3e8b9d58358b9c367c3  tv.tgz" | sha256sum -c -
          tar -xzf tv.tgz trivy && sudo mv trivy /usr/local/bin/
          python3 -c 'import yaml' 2>/dev/null || pip install -q pyyaml
      - name: scan every deployed image
        run: |
          ./scripts/deployed-images.sh > images.txt
          echo "## Deployed images: CRITICAL vulnerabilities with a fix" >> "$GITHUB_STEP_SUMMARY"
          echo "| image | CRITICAL |" >> "$GITHUB_STEP_SUMMARY"; echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          fail=0
          while read -r img; do
            ignore=(); case "$img" in *elwarrior100/lakefs-gc*) ignore=(--ignorefile images/lakefs-gc/.trivyignore) ;; esac
            n=$(trivy image --quiet --platform linux/arm64 --scanners vuln --severity CRITICAL --ignore-unfixed "${ignore[@]}" \
                  --format json "$img" 2>/dev/null | python3 -c 'import json,sys; d=json.load(sys.stdin); print(sum(len(r.get("Vulnerabilities") or []) for r in d.get("Results",[])))' || echo "scan failed")
            echo "| \`${img%%@*}\` | $n |" >> "$GITHUB_STEP_SUMMARY"
            case "$img" in *elwarrior100/*) [ "$n" = 0 ] || { echo "::error::$img has $n CRITICAL vulnerabilities with a fix"; fail=1; } ;; esac
          done < images.txt
          exit $fail

  image:
    name: image (${{ matrix.image }})
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [lakefs-gc]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: images/${{ matrix.image }}
          platforms: linux/arm64
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - name: scan (fails on CRITICAL vulnerabilities that have a fix)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: images/${{ matrix.image }}/.trivyignore   # accepted findings, each with an expiry date
      - name: push (with SBOM and provenance attestations)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: images/${{ matrix.image }}
          platforms: linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
