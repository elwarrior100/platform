# Images the platform builds itself (today only lakefs-gc). On main, when images/ changes: build natively on arm64,
# scan with Trivy (fails on CRITICAL with a fix), then push to GHCR with SBOM and provenance, tagged with the commit
# SHA. Actions pinned by commit SHA. Deploying is a separate step: the tag is set in the manifests (Argo CD applies it).
name: images

on:
  push:
    branches: [main]
    paths: [images/**, .github/workflows/images.yml]
  schedule:
    - cron: "23 6 * * 1"     # Mondays: re-scan what is DEPLOYED (new CVEs; expired entries in .trivyignore)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Weekly: scan the image tag the cluster actually runs (read from the manifest), so a new CRITICAL CVE, or an
  # accepted one whose .trivyignore entry expired, fails CI even when nobody touches images/.
  rescan-deployed:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: deployed lakefs-gc image
        id: ref
        run: echo "image=$(grep -o 'ghcr.io/[^ ]*lakefs-gc:[0-9a-f@:sha]*' envs/oracle/lakefs-gc/gc.yaml | head -1)" >> "$GITHUB_OUTPUT"
      - name: scan (fails on CRITICAL vulnerabilities that have a fix)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.image }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: images/lakefs-gc/.trivyignore

  image:
    name: image (${{ matrix.image }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [lakefs-gc]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: images/${{ matrix.image }}
          platforms: linux/arm64
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - name: scan (fails on CRITICAL vulnerabilities that have a fix)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: images/${{ matrix.image }}/.trivyignore   # accepted findings, each with an expiry date
      - name: push (with SBOM and provenance attestations)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: images/${{ matrix.image }}
          platforms: linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
